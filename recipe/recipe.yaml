context:
  name: csp-bot
  version: "2.0.3"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/csp-bot/csp_bot-${{ version }}.tar.gz
  sha256: 59a56636a63d9d4a2b94c746daa9ef8602fa68d10da731c3785423b4d1d153e5

build:
  number: 0
  noarch: python
  script: python -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - beautifulsoup4
    - ccflow >=0.5.2
    - chatom >=0.2.0
    - croniter
    - csp >=0.9,<1
    - csp-gateway >=2.5,<4
    - csp-adapter-discord
    - csp-adapter-slack
    - csp-adapter-symphony
    - dateparser
    - hydra-core
    - pandas
    - pydantic >=2

tests:
  - python:
      imports:
        - csp_bot
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  license: Apache-2.0
  license_file: LICENSE
  summary: Reactive chat bot framework
  homepage: https://github.com/Point72/csp-bot/wiki
  repository: https://github.com/Point72/csp-bot

extra:
  recipe-maintainers:
    - arhamchopra
    - ptomecek
    - timkpaine
